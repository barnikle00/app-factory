[project]
name = "factory-app"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdb: needs Docker — runs against a real, throwaway PostgreSQL"]

# ── Lint: the app-factory plugin's foundation/tooling/ruff.toml, the same rules the workspace hook applies ──
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

ignore = [
  # Line length is the formatter's job. A linter that also polices width
  # produces two authorities for one rule and they disagree at the margin.
  "E501",

  # RUF001/2/3 flag non-Latin characters (Persian, Arabic, Cyrillic…) as "ambiguous unicode".
  # In an app whose strings and comments are in such a language these three rules produced
  # 705 findings on one project — 51% of the total — and every one of them was the language,
  # not a defect.
  "RUF001",
  "RUF002",
  "RUF003",
]

# F401 is REPORTED, never auto-fixed. An import that looks unused in one file is
# often re-exported to another: in one older project, app/sales/scenarios.py
# imports MAX_BLOCKS without using it because app/help.py imports it from there.
# Auto-removing it produced a web app and a bot that fail at startup. Deleting an
# import is a decision, not tidying.
unfixable = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's entire dependency-injection API is, syntactically, a function
# call in a default argument — which is what B008 exists to catch. Without
# this list B008 fires 213 times on correct FastAPI code.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Header",
  "fastapi.Body",
  "fastapi.Path",
  "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
# Test files legitimately import for side effects and shadow names.
"tests/**" = ["F401", "F811"]
# Migrations are generated; their import order and style are not ours.
"**/alembic/versions/**" = ["I001", "E402", "F401"]
