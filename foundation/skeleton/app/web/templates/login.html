{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="error" role="alert">Wrong name or password.</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Name <input name="name" required autocomplete="username"></label>
  <label>Password <input name="password" type="password" required autocomplete="current-password" dir="ltr"></label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
